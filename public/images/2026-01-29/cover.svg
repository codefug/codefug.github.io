<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- 여러 요청이 좁은 문 하나를 한 줄로 통과해 서버에 도착한다 -->
  <ellipse cx="200" cy="222" rx="170" ry="8" fill="#4f46e5" fill-opacity="0.12"/>
  <!-- 대기줄을 잇는 선: 도형 가장자리끼리 잇고 도형이 끝을 덮는다 -->
  <path d="M74 138h18M126 138h18M178 138h18M222 138h18" stroke="#1e1b4b" stroke-width="2"/>
  <!-- 서버 -->
  <rect x="292" y="78" width="80" height="120" rx="10" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <rect x="304" y="100" width="56" height="20" rx="4" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="2"/>
  <rect x="304" y="128" width="56" height="20" rx="4" fill="#4f46e5" stroke="#1e1b4b" stroke-width="2"/>
  <rect x="304" y="156" width="56" height="20" rx="4" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="2"/>
  <circle cx="313" cy="110" r="3" fill="#818cf8"/><circle cx="313" cy="138" r="3" fill="#fff"/><circle cx="313" cy="166" r="3" fill="#818cf8"/>
  <!-- 좁은 문(큐 게이트) -->
  <rect x="196" y="72" width="26" height="132" rx="6" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="3"/>
  <path d="M209 92v92" stroke="#1e1b4b" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
  <!-- 한 줄로 대기하는 요청 카드들: 하나만 게이트 통과, 나머지는 순서대로 대기 -->
  <rect x="240" y="126" width="34" height="24" rx="5" fill="#4f46e5" stroke="#1e1b4b" stroke-width="2.5"/>
  <text x="257" y="143" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <rect x="144" y="126" width="34" height="24" rx="5" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
  <text x="161" y="143" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle">2</text>
  <rect x="92" y="126" width="34" height="24" rx="5" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
  <text x="109" y="143" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">3</text>
  <rect x="40" y="126" width="34" height="24" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="2.5"/>
  <text x="57" y="143" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle">4</text>
  <!-- 통과한 요청이 서버로 들어가는 화살표 -->
  <path d="M276 138h12" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M284 133l5 5-5 5" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
