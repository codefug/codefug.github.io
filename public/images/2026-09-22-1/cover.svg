  </g>
  <!-- 끊긴 연결선: 버튼에서 나왔지만 톱니(핸들러)에 닿지 못한다 -->
  <path d="M197 137h10" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="3 4" stroke-linecap="round"/>
  <!-- 화살표 커서: 끝이 버튼 위를 누른다 -->
