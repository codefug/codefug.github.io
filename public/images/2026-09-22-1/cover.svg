  <!-- 반응 없음 표시: 빈 말풍선 -->
  <path d="M300 96h56a10 10 0 0 1 10 10v26a10 10 0 0 1 -10 10h-30l-14 14v-14h-12a10 10 0 0 1 -10 -10v-26a10 10 0 0 1 10 -10z" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <circle cx="316" cy="121" r="3" fill="#c7d2fe"/><circle cx="328" cy="121" r="3" fill="#c7d2fe"/><circle cx="340" cy="121" r="3" fill="#c7d2fe"/>
  </g>
