<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- 페이지가 받은 초기값(A)이 공유 캐시에 쓰이고, 그 값을 받지 않은 헤더가 캐시를 읽어 서버 HTML(스켈레톤)과 어긋난다 -->
  <ellipse cx="200" cy="238" rx="170" ry="8" fill="#4f46e5" fill-opacity="0.12"/>
  <!-- 브라우저 창 -->
  <rect x="44" y="56" width="200" height="162" rx="10" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <path d="M54 56h180a10 10 0 0 1 10 10v16H44V66a10 10 0 0 1 10-10z" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="3"/>
  <circle cx="62" cy="69" r="4" fill="#818cf8"/><circle cx="76" cy="69" r="4" fill="#a5b4fc"/><circle cx="90" cy="69" r="4" fill="#c7d2fe"/>
  <!-- 헤더: 로고 자리와 사용자 메뉴 자리. 메뉴는 서버 HTML대로 스켈레톤 -->
  <rect x="58" y="92" width="44" height="8" rx="4" fill="#a5b4fc"/>
  <rect x="186" y="88" width="44" height="16" rx="8" fill="#e5e7eb"/>
  <path d="M58 112h172" stroke="#e5e7eb" stroke-width="2"/>
  <!-- 페이지 본문: 로그인 화면. 아바타 A와 데이터 카드 -->
  <circle cx="74" cy="138" r="12" fill="#4f46e5" stroke="#1e1b4b" stroke-width="2.5"/>
  <text x="74" y="142.5" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">A</text>
  <rect x="94" y="130" width="92" height="8" rx="4" fill="#1e1b4b"/>
  <rect x="94" y="144" width="60" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="62" y="166" width="168" height="38" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="74" y="178" width="70" height="6" rx="3" fill="#a5b4fc"/>
  <rect x="74" y="190" width="110" height="6" rx="3" fill="#c7d2fe"/>
  <!-- 공유 캐시: 창 밖 오른쪽. 페이지가 써 둔 A가 들어 있다 -->
  <rect x="290" y="108" width="80" height="60" rx="8" fill="#1e1b4b"/>
  <text x="330" y="124" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a5b4fc" text-anchor="middle">cache</text>
  <rect x="302" y="132" width="56" height="24" rx="5" fill="#4f46e5"/>
  <text x="330" y="148.5" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">A</text>
  <!-- 페이지 → 캐시: 렌더 도중 기록(실선, 확정) -->
  <path d="M248 164C266 164 272 156 284 150" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M275.5 148l8.5 2-4 8" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 캐시 → 헤더 메뉴: 받지도 않은 값을 읽는다(점선) -->
  <path d="M286 118C274 108 266 100 252 99" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M259 93l-7 6 7 6" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 불일치 표식: 헤더 메뉴 위의 느낌표 배지 -->
  <circle cx="232" cy="84" r="9" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
  <path d="M232 79.5v5.5" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="232" cy="88.5" r="1.4" fill="#1e1b4b"/>
</svg>
