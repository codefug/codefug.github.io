<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- 로드밸런서(300초 타이머)와 서버(5초 타이머)가 서로 모른 채 돌다가, 닫히는 소켓에 요청이 꽂혀 502가 난다 -->
  <ellipse cx="200" cy="206" rx="170" ry="8" fill="#4f46e5" fill-opacity="0.12"/>
  <!-- 로드밸런서 -->
  <rect x="30" y="80" width="110" height="100" rx="10" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <rect x="42" y="92" width="86" height="16" rx="4" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="2"/>
  <rect x="42" y="114" width="86" height="16" rx="4" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="2"/>
  <!-- 시계: 300s -->
  <circle cx="60" cy="152" r="16" fill="#fff" stroke="#4f46e5" stroke-width="2.5"/>
  <path d="M60 152V142M60 152l8 5" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round"/>
  <text x="82" y="157" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#4f46e5">300s</text>
  <!-- 연결선: 소켓 -->
  <path d="M140 130H260" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
  <!-- 서버 -->
  <rect x="260" y="80" width="110" height="100" rx="10" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <rect x="272" y="92" width="86" height="16" rx="4" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="2"/>
  <rect x="272" y="114" width="86" height="16" rx="4" fill="#c7d2fe" stroke="#1e1b4b" stroke-width="2"/>
  <!-- 시계: 5s, 급함 -->
  <circle cx="290" cy="152" r="16" fill="#fff" stroke="#a5b4fc" stroke-width="2.5"/>
  <path d="M290 152V145M290 152l6 6" stroke="#a5b4fc" stroke-width="2.2" stroke-linecap="round"/>
  <text x="312" y="157" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#818cf8">5s</text>
  <!-- 끊어지는 소켓 표시: 연결선 위에 X -->
  <path d="M193 123l14 14M207 123l-14 14" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
  <!-- 그 자리에 새 요청이 꽂힌다 -->
  <path d="M200 76V104" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M193 104l7 8 7-8" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 502 배지: 끊어진 자리 바로 아래 -->
  <rect x="170" y="150" width="60" height="26" rx="8" fill="#1e1b4b"/>
  <text x="200" y="167.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#fff">502</text>
</svg>
