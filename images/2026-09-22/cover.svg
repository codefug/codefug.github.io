<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- 크롤러가 브라우저 창을 읽는데 본문 자리엔 회색 스켈레톤 막대뿐이고, 진짜 문장은 script 상자 속에 갇혀 있다 -->
  <ellipse cx="200" cy="238" rx="170" ry="8" fill="#4f46e5" fill-opacity="0.12"/>
  <!-- 브라우저 창 -->
  <rect x="44" y="66" width="200" height="152" rx="10" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <path d="M54 66h180a10 10 0 0 1 10 10v16H44V76a10 10 0 0 1 10-10z" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="3"/>
  <circle cx="62" cy="79" r="4" fill="#818cf8"/><circle cx="76" cy="79" r="4" fill="#a5b4fc"/><circle cx="90" cy="79" r="4" fill="#c7d2fe"/>
  <!-- 스켈레톤 본문: 회색 둥근 막대만 -->
  <rect x="64" y="106" width="90" height="10" rx="4" fill="#e5e7eb"/>
  <rect x="64" y="124" width="150" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="64" y="138" width="130" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="64" y="156" width="160" height="32" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="64" y="198" width="60" height="8" rx="4" fill="#e5e7eb"/>
  <!-- script 상자: 진짜 문장이 갇혀 있는 곳. 창 위에 떨어져 떠 있다 -->
  <rect x="126" y="4" width="118" height="42" rx="8" fill="#1e1b4b"/>
  <text x="185" y="18" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a5b4fc" text-anchor="middle">script</text>
  <rect x="136" y="23" width="56" height="6" rx="3" fill="#c7d2fe"/>
  <rect x="136" y="32" width="98" height="6" rx="3" fill="#818cf8"/>
  <path d="M185 51v10" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180 56l5 5 5-5" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 크롤러 로봇 -->
  <g>
    <rect x="304" y="150" width="58" height="46" rx="10" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
    <circle cx="322" cy="170" r="6" fill="#4f46e5"/>
    <circle cx="344" cy="170" r="6" fill="#4f46e5"/>
    <rect x="318" y="182" width="30" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="327" y="134" width="12" height="16" rx="4" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
    <circle cx="333" cy="130" r="5" fill="#818cf8" stroke="#1e1b4b" stroke-width="2"/>
    <rect x="290" y="164" width="14" height="8" rx="4" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
    <rect x="362" y="164" width="14" height="8" rx="4" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
  </g>
  <!-- 로봇 시선: 브라우저 본문(스켈레톤)만 향한다 -->
  <path d="M282 168H259" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M258 162l-7 6 7 6" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
