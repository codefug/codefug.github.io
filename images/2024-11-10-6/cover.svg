<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- 세 갈래로 뻗은 Promise들이 한 신호선(AbortController)에 묶여 있고, 그중 하나가 가위질로 잘려나가는 장면 -->
  <ellipse cx="200" cy="222" rx="170" ry="8" fill="#4f46e5" fill-opacity="0.12"/>
  <!-- 왼쪽 시작점: controller -->
  <circle cx="56" cy="130" r="20" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <circle cx="56" cy="130" r="7" fill="#4f46e5"/>
  <!-- 세 갈래 신호선 -->
  <path d="M76 130C110 130 110 70 150 70" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M76 130C110 130 110 130 150 130" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 세 번째 갈래는 가위의 날 사이에서 끊기고, 끊긴 뒤쪽은 옅은 점선으로 카드까지 이어진다 -->
  <path d="M76 130C90.9 130 99.3 141.5 107.4 154.5" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M114.2 165.5C122.6 178.5 132.5 190 150 190" stroke="#c7d2fe" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <!-- 세 개의 Promise 카드 -->
  <rect x="150" y="52" width="70" height="36" rx="8" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
  <rect x="160" y="65" width="34" height="8" rx="3" fill="#e5e7eb"/>
  <rect x="150" y="112" width="70" height="36" rx="8" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
  <rect x="160" y="125" width="34" height="8" rx="3" fill="#e5e7eb"/>
  <rect x="150" y="172" width="70" height="36" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="160" y="185" width="34" height="8" rx="3" fill="#c7d2fe"/>
  <!-- 가위(abort): 날 사이에 신호선을 물고 있다 -->
  <g transform="translate(100.5,166.3) rotate(-31.7)">
    <path d="M-13 -7L19 10.2M-13 7L19 -10.2" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.6" fill="#fff"/>
    <circle cx="-13" cy="-7" r="4.5" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
    <circle cx="-13" cy="7" r="4.5" fill="#fff" stroke="#1e1b4b" stroke-width="2.5"/>
  </g>
  <!-- 합류점: all/race가 모이는 결과 부스 -->
  <path d="M220 70C260 70 260 130 290 130" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M220 130h70" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="290" y="106" width="66" height="48" rx="10" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <rect x="300" y="118" width="46" height="10" rx="4" fill="#4f46e5"/>
  <rect x="300" y="134" width="30" height="8" rx="3" fill="#e5e7eb"/>
</svg>
