<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- then으로 이어진 체인 중 한 칸에서 에러가 튀고, 체인 끝의 catch가 이를 붙잡는 장면 -->
  <ellipse cx="200" cy="222" rx="170" ry="8" fill="#4f46e5" fill-opacity="0.12"/>
  <!-- 체인 -->
  <rect x="40" y="110" width="60" height="40" rx="8" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <rect x="50" y="124" width="30" height="8" rx="3" fill="#e5e7eb"/>
  <path d="M100 130h20" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M112 123l8 7-8 7" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="110" width="60" height="40" rx="8" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <rect x="134" y="124" width="30" height="8" rx="3" fill="#e5e7eb"/>
  <path d="M184 130h20" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M196 123l8 7-8 7" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 에러 나는 칸: 느낌표 -->
  <rect x="208" y="110" width="60" height="40" rx="8" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <circle cx="238" cy="130" r="13" fill="#4f46e5"/>
  <rect x="235" y="122" width="6" height="11" rx="3" fill="#fff"/>
  <circle cx="238" cy="137.5" r="2.6" fill="#fff"/>
  <!-- 건너뛰는 then (실행 안 됨, 옅게) -->
  <path d="M268 130h20" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M280 123l8 7-8 7" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="292" y="110" width="60" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2.5"/>
  <rect x="302" y="124" width="30" height="8" rx="3" fill="#e0e7ff"/>
  <!-- 화살표: 에러 칸에서 아래 catch로 -->
  <path d="M238 157v13" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M232 164l6 7 6-7" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- catch 부스: 에러를 붙잡음 -->
  <rect x="150" y="176" width="176" height="42" rx="10" fill="#1e1b4b"/>
  <circle cx="176" cy="197" r="12" fill="#4f46e5"/>
  <path d="M170 197l4 4 8-8" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="193" width="62" height="8" rx="4" fill="#c7d2fe"/>
  <text x="312" y="201" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="end">catch</text>
</svg>
