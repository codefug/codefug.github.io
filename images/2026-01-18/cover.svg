<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- 같은 내용의 상자 둘이 서로 다른 주소에 놓여, 저울이 "다르다"로 기운다 -->
  <ellipse cx="200" cy="222" rx="170" ry="8" fill="#4f46e5" fill-opacity="0.12"/>
  <!-- 받침대 -->
  <path d="M200 84v116" stroke="#1e1b4b" stroke-width="3"/>
  <path d="M174 212l10-12h32l10 12z" fill="#fff" stroke="#1e1b4b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 저울대: 축(200,84)을 지나 왼쪽이 높고 오른쪽이 낮다 -->
  <path d="M92 65L308 103" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="84" r="7" fill="#fff" stroke="#1e1b4b" stroke-width="3"/>
  <!-- 왼쪽 접시: 주소 @1000 -->
  <path d="M42 141L92 65L142 141" stroke="#1e1b4b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M42 141h100a50 12 0 0 1-100 0z" fill="#fff" stroke="#1e1b4b" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="66" y="111" width="52" height="30" rx="5" fill="#eef2ff" stroke="#1e1b4b" stroke-width="2.5"/>
  <text x="92" y="124" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle">@1000</text>
  <rect x="76" y="130" width="32" height="4" rx="2" fill="#818cf8"/>
  <!-- 오른쪽 접시: 주소 @2000 -->
  <path d="M258 179L308 103L358 179" stroke="#1e1b4b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M258 179h100a50 12 0 0 1-100 0z" fill="#fff" stroke="#1e1b4b" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="282" y="149" width="52" height="30" rx="5" fill="#eef2ff" stroke="#1e1b4b" stroke-width="2.5"/>
  <text x="308" y="162" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle">@2000</text>
  <rect x="292" y="168" width="32" height="4" rx="2" fill="#818cf8"/>
  <!-- 판정: 다르다 -->
  <circle cx="200" cy="48" r="16" fill="#4f46e5" stroke="#1e1b4b" stroke-width="2.5"/>
  <path d="M192 44h16M192 52h16M204 39l-8 18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
