프론트엔드 개발 및 개발 환경 개선을 담당했고, Server Action 한계를 문서화해 팀의 [B]tRPC 마이그레이션[/B]을 제안·주도했습니다.\"},\"pwc\":{\"company\":\"Samil PwC AC\",\"duration\":\"2025.01 ~ 2025.10\",\"summary\":\"삼일회계법인(Big4) 100% 자회사로 회계·컨설팅 업무 디지털화를 담당하는 기술 조직. 웹 서비스 프론트엔드 개발과 디자인 시스템 구축을 담당했습니다.\"}}},\"projects\":{\"allra\":{\"title\":\"Allra\",\"subtitle\":\"Allra Fintech\",\"description\":\"이커머스 셀러들을 위한 선정산 금융 서비스 개발\",\"stack\":[\"Next.js\",\"TypeScript\",\"Tailwind CSS\",\"Zustand\",\"Tanstack Query\"],\"categories\":[{\"title\":\"개발 생산성 개선\",\"details\":[{\"text\":\"모바일 등 새로운 테스트 환경 추가 시 테스트 수가 선형 증가하는 구조\\n\\t[B]Dynamic metric + Playwright Sharding[/B]으로 병렬 실행 환경 구성해 평균 테스트 시간 [B]67.7% 단축[/B] ([L:https://team.allrafintech.co.kr/frontend-playwright-e2e-test-ci-optimization-d94b082509d8]블로그[/L])\"},{\"text\":\"ESLint·Prettier가 각각 AST를 순회해 CI 린트에 매번 2분 소요\\n\\t[B]Biome[/B]으로 전환해 평균 CI 린트 시간 [B]98% 단축[/B]\"},{\"text\":\"Datadog 과금 정책 변경으로 모니터링 툴 교체 불가피\\n\\t데브옵스팀과 협업해 [B]OpenReplay 점진적 도입[/B] 주도. CI/CD 소스맵 업로드 파이프라인 구성 중 OpenReplay 자체 버그 발견, [L:https://github.com/openreplay/openreplay/issues/4476]오픈소스 기여[/L]\"}]},{\"title\":\"코드 개선\",\"details\":[{\"text\":\"선정산 조회 페이지에 로그인 폼이 다수 공존하는 구조, 크롬 자동 채우기가 관련 없는 모든 폼을 오염시키는 문제\\n\\tChrome CPP 소스 직접 분석으로 원인 파악 후 [B]Honeypot 미끼 필드 방식으로 우회 해결[/B]\"},{\"text\":\"선정산 로직에서 자식 컴포넌트들이 각자 [B]useEffect[/B]로 상태를 변경하던 구조, 정책 누적으로 분기 난립\\n\\tProvider에서 모든 계산을 담당하고 [B]Discriminated Union[/B]으로 상태를 전달, 자식은 렌더링만 담당하도록 분리. 단위 테스트 작성으로 안정성 확보\"},{\"text\":\"Server Action 기반 아키텍처로 페이지 로딩 저하·빌드 오류 반복 발생\\n\\t직접 분석해 [B]순차 호출 한계를 문서화[/B] 후 팀 공유 ([L:https://codefug.github.io/posts/2026-01-29]블로그[/L]), [B]tRPC 마이그레이션 제안 및 팀 도입 주도[/B]\"}]},{\"title\":\"SEO 개선\",\"details\":[{\"text\":\"깊은 복사 버그로 페이지별 메타데이터 override가 전혀 동작하지 않는 문제 발견\\n\\t원인 추적 후 수정하고, 전 페이지 OG/Twitter 메타데이터를 [B]공통 유틸로 통합[/B]해 재발 방지\"},{\"text\":\"마케팅팀과 협업해 SEO 품질 강화\\n\\t[B]Schema.org JSON-LD 구조화 데이터[/B] 도입으로 검색엔진 크롤링 품질 향상\"}]}]},\"digitalFinance\":{\"title\":\"Digital Finance\",\"subtitle\":\"Samil PwC AC\",\"de
