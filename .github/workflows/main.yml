name: GitHub Pages Deploy

on:
  push:
    branches:
      - main

# 명시하지 않으면 워크플로 토큰이 저장소 전반에 쓰기 권한을 갖는다.
# 배포는 아래 personal_token으로 하므로 기본 토큰은 읽기만 있으면 된다.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      # 버전은 package.json의 packageManager 필드를 따른다.
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # CI(ci.yml)와 같은 방식으로 설치해야 검사한 것과 배포하는 것이 같아진다.
      # lockfile이 어긋나면 조용히 다른 버전을 깔지 말고 여기서 멈추는 편이 낫다.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ci.yml은 병렬로 돌아서 실패해도 배포를 못 막는다.
      # 배포 경로에도 같은 게이트를 걸어야 검사를 통과한 것만 나간다.
      # (generate-mdx는 build의 pre 스크립트가 하지만 typecheck가 먼저라 여기서 한 번 만든다)
      - name: Generate MDX map
        run: pnpm run generate-mdx

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: ./out
