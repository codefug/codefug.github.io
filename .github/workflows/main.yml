name: GitHub Pages Deploy

on:
  push:
    branches:
      - main

# 명시하지 않으면 워크플로 토큰이 저장소 전반에 쓰기 권한을 갖는다.
# 배포는 아래 personal_token으로 하므로 기본 토큰은 읽기만 있으면 된다.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: latest
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Deploy 🚀
        run: |
          touch out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: ./out
