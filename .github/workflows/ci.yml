name: CI

# main으로 푸시하면 배포 워크플로가 곧장 프로덕션에 올린다.
# 여기서 먼저 걸러야 깨진 빌드가 사이트까지 가지 않는다.
# Dependabot PR도 이 게이트를 지나야 머지 여부를 판단할 수 있다.
on:
  pull_request:
  push:
    branches:
      - main

# 검사만 하므로 읽기 권한이면 충분하다.
permissions:
  contents: read

# 같은 브랜치에 연달아 푸시하면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 버전은 package.json의 packageManager 필드를 따른다.
      # 여기에 version을 적으면 그 값이 우선해 배포와 어긋날 수 있다.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # 배포와 달리 lockfile을 고정한다.
      # 검사에 쓴 의존성과 배포본의 의존성이 다르면 통과의 의미가 없다.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # mdxMap.ts는 생성 파일이라 저장소에 없다. 타입 체크 전에 만들어야 한다.
      - name: Generate MDX map
        run: pnpm run generate-mdx

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
